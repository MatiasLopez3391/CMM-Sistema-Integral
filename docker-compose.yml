# MySQL 8 para desarrollo. Uso:
#   docker compose up -d
#   SPRING_PROFILES_ACTIVE=mysql mvn spring-boot:run
# Para cargar también los datos de demostración en MySQL:
#   SPRING_PROFILES_ACTIVE=mysql FLYWAY_LOCATIONS=classpath:db/migration,classpath:db/demo mvn spring-boot:run
# Si el puerto 3306 ya está ocupado (por ejemplo, por un MySQL instalado en la PC), use otro:
#   MYSQL_PUERTO=3307 docker compose up -d      y arranque el sistema con DB_PORT=3307
# Nombre de proyecto fijo: así el contenedor y su volumen son los mismos aunque el repositorio esté
# clonado en otra carpeta (antes, una segunda carpeta chocaba con el contenedor "cmm-mysql" ya creado).
name: cmm-sistema-integral

services:
  mysql:
    image: mysql:8.4
    container_name: cmm-mysql
    environment:
      MYSQL_DATABASE: cmm
      MYSQL_USER: cmm
      MYSQL_PASSWORD: cmm
      MYSQL_ROOT_PASSWORD: root
      TZ: America/Argentina/Mendoza
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${MYSQL_PUERTO:-3306}:3306"
    volumes:
      - cmm-mysql-data:/var/lib/mysql

volumes:
  cmm-mysql-data:
