<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema Integral CMM</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231f4e79'/><text x='16' y='22' font-size='15' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'>CM</text></svg>">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="login" id="login" hidden>
  <form class="login-caja" id="formLogin" autocomplete="on">
    <div class="marca-logo">CM</div>
    <h2>Sistema Integral CMM</h2>
    <p class="ayuda">Ingrese con su usuario y contraseña.</p>
    <div id="loginError" class="cinta error" role="alert" hidden></div>
    <div class="campo">
      <label for="loginUsuario">Usuario</label>
      <input id="loginUsuario" name="usuario" autocomplete="username" maxlength="40" required autofocus>
    </div>
    <div class="campo">
      <label for="loginClave">Contraseña</label>
      <div class="clave-caja">
        <input id="loginClave" name="clave" type="password" autocomplete="current-password" maxlength="100" required>
        <button type="button" class="clave-ojo" id="btnVerClave" aria-label="Mostrar contraseña" aria-pressed="false" title="Mostrar contraseña">
          <svg class="ojo-abierto" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="ojo-cerrado" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.9 10.9 0 0 1 12 5c7 0 11 7 11 7a19.7 19.7 0 0 1-3.17 4.19"/><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
    </div>
    <button class="btn primario" id="btnIngresar" type="submit">Ingresar</button>
  </form>
</div>
<div class="layout" id="layout" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="marca">
      <div class="marca-logo">CM</div>
      <div>
        <div class="marca-nombre">Círculo Médico</div>
        <div class="marca-sub">Sistema Integral de Gestión</div>
      </div>
    </div>
    <nav id="menu">
      <a href="#/inicio" data-ruta="inicio">Inicio</a>
      <div class="menu-grupo">Afiliados</div>
      <a href="#/afiliados" data-ruta="afiliados">Afiliados</a>
      <a href="#/planes" data-ruta="planes">Planes y cobertura</a>
      <a href="#/prestadores" data-ruta="prestadores">Prestadores y coseguro</a>
      <a href="#/derivadoras" data-ruta="derivadoras">Derivadoras</a>
      <div class="menu-grupo">Facturación y cobranza</div>
      <a href="#/cuotas" data-ruta="cuotas">Cuotas</a>
      <a href="#/cobranza" data-ruta="cobranza">Cobranza</a>
      <a href="#/morosos" data-ruta="morosos">Morosos</a>
      <a href="#/contabilidad" data-ruta="contabilidad">Exportación contable</a>
      <div class="menu-grupo">Sistema</div>
      <a href="#/configuracion" data-ruta="configuracion">Configuración</a>
    </nav>
  </aside>
  <div class="principal">
    <header class="barra">
      <button class="btn-menu" id="btnMenu" aria-label="Menú">☰</button>
      <h1 id="titulo">Inicio</h1>
      <div class="sesion" title="Su nombre queda registrado en cada operación">
        <span id="sesionNombre"></span>
        <button class="btn chico" id="btnSalir" type="button">Cerrar sesión</button>
      </div>
    </header>
    <main id="vista" class="vista"></main>
  </div>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
